<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 736" width="1100" height="736" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
    <style>
      .t { font-size: 12px; fill: #222; }
      .tb { font-size: 13px; font-weight: bold; fill: #222; }
      .ts { font-size: 11px; fill: #666; }
      .halo { fill: #333; }
      .line { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7a7a7a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="736" fill="#ffffff"/>
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#222">AWS architecture: Terraform, HTTPS ALB, Auto Scaling EC2, RDS MySQL</text>

  <!-- Top row -->
  <rect x="40" y="50" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="78" text-anchor="middle" class="tb">Internet users</text>

  <rect x="250" y="50" width="140" height="46" rx="8" fill="#ede9fe" stroke="#8c4fff" stroke-width="1.5"/>
  <text x="320" y="70" text-anchor="middle" class="tb">Route 53</text>
  <text x="320" y="86" text-anchor="middle" class="ts">A record (alias to ALB)</text>

  <rect x="450" y="50" width="140" height="46" rx="8" fill="#fee2e2" stroke="#dd344c" stroke-width="1.5"/>
  <text x="520" y="70" text-anchor="middle" class="tb">ACM certificate</text>
  <text x="520" y="86" text-anchor="middle" class="ts">DNS validated</text>

  <rect x="820" y="50" width="240" height="60" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="940" y="73" text-anchor="middle" class="tb">GitHub Actions</text>
  <text x="940" y="91" text-anchor="middle" class="ts">fmt, validate, plan, apply, verify</text>
  <text x="940" y="104" text-anchor="middle" class="ts">(OIDC, no stored AWS keys)</text>

  <path class="line" d="M190 73 H250"/>
  <text x="196" y="66" class="ts">DNS</text>

  <!-- AWS cloud / VPC / AZ frames -->
  <rect x="20" y="125" width="1060" height="565" rx="10" fill="none" stroke="#ed7100" stroke-width="2"/>
  <text x="35" y="146" class="tb" fill="#ed7100" style="fill:#ed7100">AWS Cloud - Region ap-south-1</text>

  <rect x="40" y="160" width="790" height="510" rx="10" fill="#f8fafc" stroke="#3f8624" stroke-width="2"/>
  <text x="55" y="180" class="tb" style="fill:#3f8624">VPC 10.20.0.0/16</text>

  <rect x="60" y="195" width="360" height="455" rx="8" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="75" y="213" class="tb">Availability Zone A</text>
  <rect x="440" y="195" width="360" height="455" rx="8" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="455" y="213" class="tb">Availability Zone B</text>

  <!-- Public subnets -->
  <rect x="75" y="218" width="330" height="120" rx="6" fill="#ecfdf5" stroke="#3f8624" stroke-width="1.2"/>
  <rect x="455" y="218" width="330" height="120" rx="6" fill="#ecfdf5" stroke="#3f8624" stroke-width="1.2"/>
  <text x="85" y="332" class="ts">Public subnet</text>
  <text x="465" y="332" class="ts">Public subnet</text>

  <!-- Internet Gateway straddling the VPC edge -->
  <rect x="365" y="143" width="130" height="34" rx="6" fill="#ecfdf5" stroke="#3f8624" stroke-width="1.5"/>
  <text x="430" y="164" text-anchor="middle" class="tb">Internet Gateway</text>

  <!-- ALB spanning both AZs -->
  <rect x="100" y="228" width="620" height="40" rx="6" fill="#ede9fe" stroke="#8c4fff" stroke-width="1.8"/>
  <text x="410" y="246" text-anchor="middle" class="tb">Application Load Balancer (HTTPS :443, TLS 1.3 policy)</text>
  <text x="410" y="261" text-anchor="middle" class="ts">HTTP :80 returns 301 to HTTPS | health check GET /health</text>

  <!-- NAT gateways -->
  <rect x="290" y="278" width="110" height="40" rx="6" fill="#fff" stroke="#3f8624" stroke-width="1.4"/>
  <text x="345" y="296" text-anchor="middle" class="tb">NAT GW</text>
  <text x="345" y="310" text-anchor="middle" class="ts">AZ A</text>
  <rect x="670" y="278" width="110" height="40" rx="6" fill="#fff" stroke="#3f8624" stroke-width="1.4"/>
  <text x="725" y="296" text-anchor="middle" class="tb">NAT GW</text>
  <text x="725" y="310" text-anchor="middle" class="ts">AZ B</text>

  <!-- Private app subnets -->
  <rect x="75" y="360" width="330" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="455" y="360" width="330" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="85" y="484" class="ts">Private app subnet</text>
  <text x="465" y="484" class="ts">Private app subnet</text>

  <!-- ASG -->
  <rect x="108" y="372" width="644" height="106" rx="6" fill="none" stroke="#ed7100" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="118" y="387" class="ts" style="fill:#b45309">Auto Scaling Group</text>
  <text x="745" y="387" text-anchor="end" class="ts" style="fill:#b45309">min 2, max 4, CPU scaling</text>
  <rect x="120" y="394" width="240" height="68" rx="6" fill="#fff7ed" stroke="#ed7100" stroke-width="1.6"/>
  <text x="240" y="418" text-anchor="middle" class="tb">EC2 (Amazon Linux 2023)</text>
  <text x="240" y="436" text-anchor="middle" class="ts">Flask + gunicorn :8080, IMDSv2</text>
  <text x="240" y="451" text-anchor="middle" class="ts">encrypted EBS, SSM (no SSH)</text>
  <rect x="500" y="394" width="240" height="68" rx="6" fill="#fff7ed" stroke="#ed7100" stroke-width="1.6"/>
  <text x="620" y="418" text-anchor="middle" class="tb">EC2 (Amazon Linux 2023)</text>
  <text x="620" y="436" text-anchor="middle" class="ts">Flask + gunicorn :8080, IMDSv2</text>
  <text x="620" y="451" text-anchor="middle" class="ts">encrypted EBS, SSM (no SSH)</text>

  <!-- Private DB subnets -->
  <rect x="75" y="515" width="330" height="125" rx="6" fill="#f5f3ff" stroke="#3b48cc" stroke-width="1.2"/>
  <rect x="455" y="515" width="330" height="125" rx="6" fill="#f5f3ff" stroke="#3b48cc" stroke-width="1.2"/>
  <text x="85" y="633" class="ts">Private DB subnet (no internet route)</text>
  <text x="465" y="633" class="ts">Private DB subnet (no internet route)</text>
  <rect x="120" y="537" width="240" height="64" rx="6" fill="#e0e7ff" stroke="#3b48cc" stroke-width="1.6"/>
  <text x="240" y="562" text-anchor="middle" class="tb">RDS MySQL 8.0 (primary)</text>
  <text x="240" y="579" text-anchor="middle" class="ts">encrypted with KMS, TLS only</text>
  <rect x="500" y="537" width="240" height="64" rx="6" fill="#e0e7ff" stroke="#3b48cc" stroke-width="1.6"/>
  <text x="620" y="562" text-anchor="middle" class="tb">RDS MySQL (Multi-AZ standby)</text>
  <text x="620" y="579" text-anchor="middle" class="ts">automatic failover</text>

  <!-- Right column: managed services -->
  <rect x="850" y="170" width="210" height="56" rx="8" fill="#ecfdf5" stroke="#3f8624" stroke-width="1.5"/>
  <text x="955" y="192" text-anchor="middle" class="tb">S3: ALB access logs</text>
  <text x="955" y="209" text-anchor="middle" class="ts">SSE-S3, lifecycle expiry</text>

  <rect x="850" y="246" width="210" height="56" rx="8" fill="#ecfdf5" stroke="#3f8624" stroke-width="1.5"/>
  <text x="955" y="268" text-anchor="middle" class="tb">S3: application bucket</text>
  <text x="955" y="285" text-anchor="middle" class="ts">releases + data, SSE-KMS, versioned</text>

  <rect x="850" y="336" width="210" height="56" rx="8" fill="#fee2e2" stroke="#dd344c" stroke-width="1.5"/>
  <text x="955" y="358" text-anchor="middle" class="tb">Secrets Manager</text>
  <text x="955" y="375" text-anchor="middle" class="ts">DB credentials + endpoint (KMS)</text>

  <rect x="850" y="426" width="210" height="56" rx="8" fill="#fee2e2" stroke="#dd344c" stroke-width="1.5"/>
  <text x="955" y="448" text-anchor="middle" class="tb">KMS customer key</text>
  <text x="955" y="465" text-anchor="middle" class="ts">rotation enabled</text>

  <rect x="850" y="516" width="210" height="56" rx="8" fill="#fee2e2" stroke="#dd344c" stroke-width="1.5"/>
  <text x="955" y="538" text-anchor="middle" class="tb">IAM instance role</text>
  <text x="955" y="555" text-anchor="middle" class="ts">least privilege + SSM core</text>

  <rect x="850" y="596" width="210" height="56" rx="8" fill="#ecfdf5" stroke="#3f8624" stroke-width="1.5"/>
  <text x="955" y="618" text-anchor="middle" class="tb">S3: Terraform state</text>
  <text x="955" y="635" text-anchor="middle" class="ts">versioned, native state locking</text>

  <!-- Arrows -->
  <path class="line" d="M115 96 V118 H430 V143"/>
  <rect x="126" y="101" width="108" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="130" y="112" class="ts halo">HTTPS 443 / HTTP 80</text>
  <path class="line" d="M430 177 V228"/>
  <path class="dash" d="M520 96 V228"/>
  <rect x="524" y="175" width="78" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="528" y="186" class="ts halo">TLS certificate</text>

  <path class="line" d="M220 268 V394"/>
  <path class="line" d="M600 268 V394"/>
  <rect x="222" y="339" width="50" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="226" y="350" class="ts halo">port 8080</text>

  <path class="line" d="M240 462 V537"/>
  <rect x="244" y="496" width="94" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="248" y="507" class="ts halo">MySQL 3306 (TLS)</text>
  <path class="line" d="M540 462 L345 537"/>

  <path class="line" d="M360 569 H500" marker-start="url(#arrow)"/>
  <rect x="368" y="550" width="88" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="372" y="561" class="ts halo">sync replication</text>

  <path class="line" d="M720 248 L850 198"/>
  <rect x="748" y="201" width="62" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="752" y="212" class="ts halo">access logs</text>
  <path class="line" d="M740 405 L850 280"/>
  <path class="line" d="M740 440 L850 370"/>
  <rect x="756" y="407" width="82" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="760" y="418" class="ts halo">GetSecretValue</text>
  <path class="dash" d="M740 569 L850 462"/>
  <rect x="771" y="549" width="64" height="14" fill="#ffffff" opacity="0.92"/>
  <text x="775" y="560" class="ts halo">at-rest keys</text>

  <path class="dash" d="M940 110 V138"/>
  <text x="948" y="123" class="ts halo">terraform apply (OIDC role)</text>

  <text x="40" y="709" class="ts">Private subnets reach the internet only through NAT gateways (one per AZ); S3 traffic uses a VPC gateway endpoint.</text>
  <text x="40" y="725" class="ts">Only the ALB security group can reach the instances; only the instances can reach the database.</text>
</svg>
